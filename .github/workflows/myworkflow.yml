name: Selenium Java Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Install Apache, PHP, MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 php php-mysql php-curl php-gd php-json mysql-server

      - name: Start Services
        run: |
          sudo systemctl start apache2
          sudo systemctl start mysql

      - name: Create OpenCart Database
        run: |
          sudo mysql -e "CREATE DATABASE opencart;"
          sudo mysql -e "GRANT ALL PRIVILEGES ON opencart.* TO 'opencart'@'localhost' IDENTIFIED BY 'opencart';"
          sudo mysql -e "FLUSH PRIVILEGES;"

      - name: Copy OpenCart Files
        run: |
          sudo mkdir -p /var/www/html/opencart
          sudo cp -R ./* /var/www/html/opencart/
          sudo chown -R www-data:www-data /var/www/html/opencart
          sudo chmod -R 755 /var/www/html/opencart

      - name: Configure Apache for OpenCart
        run: |
          sudo tee /etc/apache2/sites-available/opencart.conf > /dev/null <<EOF
          <VirtualHost *:80>
              ServerName localhost
              DocumentRoot /var/www/html/opencart
              <Directory /var/www/html/opencart>
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>
          EOF
          sudo a2ensite opencart
          sudo a2enmod rewrite
          sudo systemctl reload apache2

      - name: Wait for OpenCart to be accessible
        run: |
          for i in {1..30}; do
            if curl -f http://localhost/opencart/mayankadmin/ > /dev/null 2>&1; then
              echo "OpenCart is ready!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Failed to access OpenCart"
          exit 1

      - name: Run TestNG Suite
        run: mvn clean test -DsuiteXmlFile=testng.xml

      - name: Upload TestNG Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: target/surefire-reports
