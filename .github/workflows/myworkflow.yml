name: Selenium Java Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    env:
      DB_NAME: opencart
      DB_USER: opencart
      DB_PASSWORD: opencart_password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      OPENCART_PATH: /var/www/html/opencart

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Install Apache, PHP, and MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apache2 \
            php \
            php-mysql \
            php-curl \
            php-gd \
            php-json \
            php-xml \
            php-zip \
            mysql-server \
            curl

      - name: Start Services
        run: |
          sudo systemctl start mysql
          sudo systemctl start apache2
          sudo systemctl enable mysql
          sudo systemctl enable apache2

      # Ubuntu GitHub runners authenticate MySQL root through the Unix socket.
      # Do not use "mysql -u root" over TCP with an empty password.
      - name: Create OpenCart Database User
        run: |
          sudo mysql --protocol=socket <<SQL
          CREATE DATABASE IF NOT EXISTS \`${DB_NAME}\`;

          CREATE USER IF NOT EXISTS '${DB_USER}'@'localhost'
            IDENTIFIED BY '${DB_PASSWORD}';

          ALTER USER '${DB_USER}'@'localhost'
            IDENTIFIED BY '${DB_PASSWORD}';

          CREATE USER IF NOT EXISTS '${DB_USER}'@'127.0.0.1'
            IDENTIFIED BY '${DB_PASSWORD}';

          ALTER USER '${DB_USER}'@'127.0.0.1'
            IDENTIFIED BY '${DB_PASSWORD}';

          GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'localhost';
          GRANT ALL PRIVILEGES ON \`${DB_NAME}\`.* TO '${DB_USER}'@'127.0.0.1';

          FLUSH PRIVILEGES;
          SQL

      - name: Verify OpenCart Database Login
        env:
          MYSQL_PWD: ${{ env.DB_PASSWORD }}
        run: |
          mysql \
            --host="${DB_HOST}" \
            --port="${DB_PORT}" \
            --user="${DB_USER}" \
            --database="${DB_NAME}" \
            -e "SELECT USER(), DATABASE();"

      - name: Copy OpenCart Files
        run: |
          sudo mkdir -p "${OPENCART_PATH}"
          sudo cp -R ./* "${OPENCART_PATH}/"
          sudo chown -R www-data:www-data "${OPENCART_PATH}"
          sudo chmod -R 755 "${OPENCART_PATH}"

      - name: Configure OpenCart Database Credentials
        run: |
          CONFIG_FILES=()

          if [ -f "${OPENCART_PATH}/config.php" ]; then
            CONFIG_FILES+=("${OPENCART_PATH}/config.php")
          fi

          if [ -f "${OPENCART_PATH}/admin/config.php" ]; then
            CONFIG_FILES+=("${OPENCART_PATH}/admin/config.php")
          fi

          if [ -f "${OPENCART_PATH}/mayankadmin/config.php" ]; then
            CONFIG_FILES+=("${OPENCART_PATH}/mayankadmin/config.php")
          fi

          if [ "${#CONFIG_FILES[@]}" -eq 0 ]; then
            echo "No OpenCart config.php file was found."
            echo "OpenCart must be installed first, or config.php files must be supplied."
            exit 1
          fi

          for FILE in "${CONFIG_FILES[@]}"; do
            echo "Updating database settings in ${FILE}"

            sudo sed -i \
              "s/define(['\"]DB_HOSTNAME['\"],[[:space:]]*['\"][^'\"]*['\"]);/define('DB_HOSTNAME', '${DB_HOST}');/" \
              "${FILE}" || true

            sudo sed -i \
              "s/define(['\"]DB_USERNAME['\"],[[:space:]]*['\"][^'\"]*['\"]);/define('DB_USERNAME', '${DB_USER}');/" \
              "${FILE}" || true

            sudo sed -i \
              "s/define(['\"]DB_PASSWORD['\"],[[:space:]]*['\"][^'\"]*['\"]);/define('DB_PASSWORD', '${DB_PASSWORD}');/" \
              "${FILE}" || true

            sudo sed -i \
              "s/define(['\"]DB_DATABASE['\"],[[:space:]]*['\"][^'\"]*['\"]);/define('DB_DATABASE', '${DB_NAME}');/" \
              "${FILE}" || true

            sudo chown www-data:www-data "${FILE}"
            sudo chmod 644 "${FILE}"
          done

      - name: Configure Apache for OpenCart
        run: |
          sudo tee /etc/apache2/sites-available/opencart.conf > /dev/null <<EOF
          <VirtualHost *:80>
              ServerName localhost
              DocumentRoot ${OPENCART_PATH}

              <Directory ${OPENCART_PATH}>
                  AllowOverride All
                  Require all granted
              </Directory>

              ErrorLog \${APACHE_LOG_DIR}/opencart-error.log
              CustomLog \${APACHE_LOG_DIR}/opencart-access.log combined
          </VirtualHost>
          EOF

          sudo a2dissite 000-default.conf || true
          sudo a2ensite opencart.conf
          sudo a2enmod rewrite
          sudo apache2ctl configtest
          sudo system*
