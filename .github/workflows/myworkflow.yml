name: OpenCart Automation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  automation-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: opencart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            if docker exec "${{ job.services.mariadb.id }}" \
              mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MariaDB is ready!"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "MariaDB did not become ready in time."
              exit 1
            fi

            echo "Waiting for MariaDB..."
            sleep 2
          done

      - name: Initialize OpenCart database
        run: |
          docker exec -i "${{ job.services.mariadb.id }}" \
            mariadb -uroot -proot opencart < db/opencart.sql

      - name: Verify database
        run: |
          docker exec "${{ job.services.mariadb.id }}" \
            mariadb -uroot -proot opencart \
            -e "SHOW TABLES;"

      - name: Run automation tests
        env:
          CI: true
          DB_URL: jdbc:mariadb://127.0.0.1:3306/opencart
          DB_USER: root
          DB_PASSWORD: root
        run: |
          mvn clean test

      - name: Upload TestNG/Extent reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-test-reports
          path: |
            test-output/
            target/surefire-reports/
            reports/
          if-no-files-found: warn